<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Panel - Blur Tracker</title>
  <meta name="description" content="Blur Tracker — Racing Score Tracker" />
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header class="top-nav">
    <a class="back-link" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg>
      BACK TO CHAMPIONSHIP
    </a>
    <span class="nav-label" id="auth-status">CONTROL PANEL</span>
  </header>

  <div class="rank-shell" id="login-gate" style="display:none;">
    <section class="section">
      <h2 class="section-heading">ENTRAR</h2>
      <div class="panel">
        <form id="login-form" class="player-form" style="max-width: 22rem; margin: 0 auto;">
          <div class="field">
            <label for="login-password">Senha do grupo</label>
            <input id="login-password" type="password" placeholder="Senha combinada com o grupo" autocomplete="current-password" />
          </div>
          <div class="actions">
            <button type="submit" class="primary-btn">ENTRAR</button>
          </div>
        </form>
      </div>
    </section>
  </div>

  <div class="rank-shell" id="manage-content" style="display:none;">
    <section class="section">
      <h2 class="section-heading">LOG SESSION</h2>
      <div class="panel" id="log-session-panel"></div>
    </section>

    <section class="section">
      <h2 class="section-heading">PARTICIPANTES</h2>
      <div class="panel" id="participants-panel"></div>
    </section>
  </div>

  <footer class="site-footer">
    <div>BLUR RACING CHAMPIONSHIP &copy; <span id="footer-year"></span></div>
    <div class="tagline">may the fastest racer win</div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/manage.js"></script>
</body>
</html>
